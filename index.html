<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>광장</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon_192.png">
  <meta name="theme-color" content="#4285f4">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 앱 글꼴 SUIT (가변 굵기, 사용자 선택 2026-09-20) -->
  <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
  <!-- 앱 이름 "광장" 글꼴: 두 글자만 받음(text=) -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&text=%EA%B4%91%EC%9E%A5&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <!-- 첫 로딩 -->
  <div id="bootView" class="boot">
    <div class="spinner"></div>
  </div>

  <!-- 로그인 -->
  <section id="loginView" class="login-wrap" hidden>
    <div class="login-card">
      <div class="login-brand">ⓒ JEONGKAPSU</div>
      <div class="login-logo">🏫</div>
      <h1 id="loginTitle" class="app-name">광장</h1>
      <p class="login-sub">학생은 학번, 선생님은 부여받은 ID로 로그인하세요.</p>
      <form id="loginForm" autocomplete="on">
        <input type="text" id="loginId" placeholder="학번 또는 교사 ID" autocomplete="username" autocapitalize="off" required>
        <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password" required>
        <button type="submit" id="loginBtn" class="btn primary block">로그인</button>
      </form>
      <p class="login-help">비밀번호를 잊었다면 담임 또는 담당 선생님께 초기화를 요청하세요.</p>
    </div>
  </section>

  <!-- 앱 -->
  <section id="appView" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <button id="backBtn" class="icon-btn" aria-label="뒤로" hidden>
          <svg class="back-ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div id="pageTitle" class="page-title"></div>
      </div>
      <a id="homeBtn" class="icon-btn home-btn" href="#/home" aria-label="홈" title="첫 화면">
        <svg viewBox="0 0 24 24"><path d="M12 2.6c-.5 0-.96.17-1.32.46L4.1 8.3C3.4 8.86 3 9.7 3 10.6v8.9C3 20.33 3.67 21 4.5 21H8.2c.55 0 1-.45 1-1v-4.1c0-1.05.85-1.9 1.9-1.9h1.8c1.05 0 1.9.85 1.9 1.9V20c0 .55.45 1 1 1h3.7c.83 0 1.5-.67 1.5-1.5v-8.9c0-.9-.4-1.74-1.1-2.3l-6.58-5.24A2.1 2.1 0 0 0 12 2.6z"/></svg>
      </a>
      <div class="topbar-right">
        <div class="user-chip" id="userChip" role="button" tabindex="0">
          <span id="userName"></span>
          <span id="userRole" class="role-badge"></span>
        </div>
      </div>
    </header>
    <main id="main"></main>
  </section>

  <div id="toast" class="toast"></div>
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div id="loadingText">처리 중...</div>
  </div>

  <script type="module" src="js/app.js?v=2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
